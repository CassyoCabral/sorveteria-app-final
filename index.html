<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sorveteria - Pedidos</title>
  <style>
    :root {
      /* Paleta inspirada na logo */
      --color-sky-turquoise: #2EC4B6; /* Céu */
      --color-icecream-pink: #E889AC; /* Sorvete */
      --color-sky-light: #A2E8DD;
      
      --bg-dark: #121212;
      --bg-card: #1E1E1E;
      --bg-modal: #FFFFFF;
      --text-dark: #2B3A3A;
      --text-muted: #777777;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Topbar */
    .topbar {
      background-color: #1A1A1A;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: calc(12px + env(safe-area-inset-top));
    }

    .topbar h1 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    /* Banner Principal */
    .banner {
      background: linear-gradient(180deg, #3D2B22 0%, #1A1817 100%);
      padding: 20px 16px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
    }

    .banner-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #FFFFFF;
    }

    .banner-subtitle {
      font-size: 0.85rem;
      color: var(--color-sky-light);
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background-color: var(--color-sky-turquoise);
      border-radius: 50%;
    }

    /* Card de Pedido Ativo */
    .order-card {
      background-color: var(--bg-card);
      margin: 20px 16px;
      padding: 16px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border: 1px solid #2A2A2A;
    }

    .order-name {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .order-count {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .order-price {
      color: var(--color-sky-turquoise);
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Modal / Bottom Sheet */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none; /* Oculto por padrão para não travar a tela */
      justify-content: flex-end;
      flex-direction: column;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background-color: var(--bg-modal);
      color: var(--text-dark);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 20px 16px;
      max-height: 75vh;
      display: flex;
      flex-direction: column;

      /* Ajuste de espaço para não cortar na navegação/botão voltar */
      padding-bottom: calc(28px + env(safe-area-inset-bottom));
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      font-size: 1.15rem;
      color: var(--text-dark);
      font-weight: 700;
    }

    .close-btn {
      font-size: 1.4rem;
      color: #666;
      cursor: pointer;
      padding: 4px;
    }

    /* Carrossel de Categorias */
    .categories {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .category-btn {
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      background-color: #EBF8F6;
      color: var(--color-sky-turquoise);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .category-btn.active {
      background-color: var(--color-sky-turquoise);
      color: #FFFFFF;
    }

    /* Lista de Itens */
    .item-list {
      overflow-y: auto;
      flex: 1;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid #F0F0F0;
    }

    .item-name {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-dark);
    }

    .item-price {
      color: var(--color-sky-turquoise);
      font-weight: 700;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <!-- Barra Superior -->
  <div class="topbar">
    <h1>Sorveteria</h1>
  </div>

  <!-- Banner -->
  <div class="banner">
    <div class="banner-title">
      🍦 Sorveteria — Pedidos
    </div>
    <div class="banner-subtitle">
      <span class="dot"></span> Sincronizado em tempo real entre os dispositivos
    </div>
  </div>

  <!-- Card do Cliente/Pedido (Clique para abrir) -->
  <div class="order-card" onclick="openModal()">
    <div>
      <div class="order-name">Cassyo2</div>
      <div class="order-count">0 item(ns)</div>
    </div>
    <div class="order-price">
      R$ 0,00 ▾
    </div>
  </div>

  <!-- Bottom Sheet / Modal Interativo -->
  <div id="modalOverlay" class="modal-overlay" onclick="closeModalOnBackdrop(event)">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Adicionar item — Cassyo2</h3>
        <span class="close-btn" onclick="closeModal()">✕</span>
      </div>

      <div class="categories">
        <button class="category-btn">🍨 Massas</button>
        <button class="category-btn active">🥣 Potes</button>
        <button class="category-btn">🍉 Picolés de fruta</button>
      </div>

      <div class="item-list">
        <div class="item-row">
          <span class="item-name">Tradicional</span>
          <span class="item-price">R$ 25,00</span>
        </div>
        <div class="item-row">
          <span class="item-name">Gourmet</span>
          <span class="item-price">R$ 35,00</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    // Fecha o modal ao clicar fora do cartão
    function closeModalOnBackdrop(event) {
      if (event.target.id === 'modalOverlay') {
        closeModal();
      }
    }
  </script>

</body>
</html>
