<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sorveteira - Pedidos</title>
  <style>
    :root {
      /* Paleta extraída da imagem */
      --color-sky-turquoise: #2EC4B6;
      --color-icecream-pink: #E889AC;
      --color-sky-light: #A2E8DD;
      --color-pink-dark: #C85280;
      
      --bg-dark: #1E1E1E;
      --bg-card: #322A26;
      --bg-modal: #FFFFFF;
      --text-dark: #2B3A3A;
      --text-muted: #666666;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: #FFFFFF;
    }

    /* Cabeçalho com cor do Céu */
    .header {
      background-color: var(--color-sky-turquoise);
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: calc(16px + env(safe-area-inset-top));
    }

    .header h1 {
      font-size: 1.2rem;
    }

    /* Sub-header banner */
    .banner {
      background-color: var(--bg-card);
      padding: 16px;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
    }

    .banner h2 {
      font-size: 1.1rem;
      color: #FFFFFF;
    }

    .banner p {
      font-size: 0.8rem;
      color: var(--color-sky-light);
      margin-top: 4px;
    }

    /* Card do Pedido */
    .order-card {
      background-color: #2C2C2C;
      margin: 16px;
      padding: 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Modal / Bottom Sheet Corrigido */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: flex-end;
      flex-direction: column;
    }

    .modal-content {
      background-color: var(--bg-modal);
      color: var(--text-dark);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px 16px;
      max-height: 70vh;
      display: flex;
      flex-direction: column;

      /* CORREÇÃO DA SOBREPOSIÇÃO ABAIXO DO BOTÃO DE VOLTAR */
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h3 {
      font-size: 1.1rem;
      color: var(--text-dark);
    }

    /* Categorias com as novas cores */
    .categories {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
    }

    .category-btn {
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      background-color: #E8F7F5;
      color: var(--color-sky-turquoise);
    }

    .category-btn.active {
      background-color: var(--color-sky-turquoise);
      color: #FFFFFF;
    }

    .category-btn.pink-active {
      background-color: var(--color-icecream-pink);
      color: #FFFFFF;
    }

    /* Lista de Itens Rolável */
    .item-list {
      overflow-y: auto;
      flex: 1;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #EEEEEE;
    }

    .item-price {
      color: var(--color-sky-turquoise);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Sorveteria</h1>
  </div>

  <div class="banner">
    <h2>🍨 Sorveteria — Pedidos</h2>
    <p>• Sincronizado em tempo real entre os dispositivos</p>
  </div>

  <div class="order-card">
    <div>
      <strong>Cassyo2</strong>
      <div style="font-size: 0.8rem; color: #AAA;">0 item(ns)</div>
    </div>
    <div style="color: var(--color-sky-turquoise); font-weight: bold;">R$ 0,00 ▾</div>
  </div>

  <!-- Modal Bottom Sheet -->
  <div class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Adicionar item — Cassyo2</h3>
        <span style="cursor: pointer; font-size: 1.2rem;">✕</span>
      </div>

      <div class="categories">
        <button class="category-btn">🍧 Massas</button>
        <button class="category-btn active">🥣 Potes</button>
        <button class="category-btn">🍉 Picolés de fruta</button>
      </div>

      <div class="item-list">
        <div class="item-row">
          <span>Tradicional</span>
          <span class="item-price">R$ 25,00</span>
        </div>
        <div class="item-row">
          <span>Gourmet</span>
          <span class="item-price">R$ 35,00</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
